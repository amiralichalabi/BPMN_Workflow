name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (compiles the .NET app and fetches the editor bundle)
        run: docker build -t bpmn-studio .
      - name: Start and smoke-test
        run: |
          export SQL_PASSWORD='Ci_Passw0rd_12345' ADMIN_PASSWORD='ci-password-12345'
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs localhost:8080/health && break; sleep 3; done
          docker compose logs studio | tail -n 30
          bash scripts/smoke.sh
